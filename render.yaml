services:
  - type: web
    name: picklebowl-backend
    env: python
    rootDir: Backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: picklebowl-db
          property: connectionString

databases:
  - name: picklebowl-db
    plan: free
    databaseName: picklebowl
    user: picklebowl_user
